name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client (화면만 배포 — API는 Cloud Run 등 별도 호스팅 필요)
        # Settings → Secrets and variables → Actions → Variables에 API_BASE_URL을
        # 등록해두면(예: Cloud Run URL) 빌드된 화면이 그 주소로 /api 요청을 보낸다.
        # 비워두면 상대경로(/api/...)로 빌드되어 API 호출이 실패한다.
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: npm run build --workspace=client

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
